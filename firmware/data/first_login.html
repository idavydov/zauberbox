<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zauberbox Setup</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --fg: #171a21;
        --muted: #667085;
        --line: #d7dce5;
        --accent: #0a7ea4;
        --accent-strong: #086786;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      dialog {
        border: 0;
        border-radius: 18px;
        padding: 0;
        max-width: 28rem;
        width: min(100%, 28rem);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
      }
      dialog::backdrop {
        background: rgba(17, 24, 39, 0.4);
        backdrop-filter: blur(4px);
      }
      article {
        padding: 1.5rem 1.5rem 1.25rem;
        background: #fff;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 1rem 0 0.35rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid rgba(10, 126, 164, 0.18);
        border-color: var(--accent);
      }
      button {
        margin-top: 1rem;
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-strong);
      }
      .error {
        margin-top: 0.75rem;
        color: #b42318;
        font-weight: 600;
      }
      .note {
        margin-top: 1rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <dialog open>
        <article>
          <h1>Set a new app password</h1>
          <p>You are signed in with the default Zauberbox web password. Set a new password now before using the normal STA app.</p>
          <p>The username stays <strong>__USERNAME__</strong>. Only the password changes here.</p>
          <form id="pw-form">
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              minlength="4"
              autocomplete="new-password"
              required
              autofocus
            />
            <button type="submit">Save password</button>
            __ERROR_BLOCK__
            <p class="note" id="status"></p>
          </form>
        </article>
      </dialog>
      <script>
        const form = document.getElementById("pw-form");
        const password = document.getElementById("password");
        const status = document.getElementById("status");
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          status.textContent = "Saving password...";
          const response = await fetch("/api/auth/password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password.value }),
          });
          const data = await response.json().catch(() => ({
            success: false,
            error: "Invalid server response",
          }));
          if (!response.ok || !data.success) {
            status.textContent = data.error || "Failed to save password.";
            return;
          }
          status.textContent =
            "Password updated. Reloading. Sign in again with the new password.";
          setTimeout(() => {
            window.location.href = "/";
          }, 600);
        });
      </script>
    </main>
  </body>
</html>
