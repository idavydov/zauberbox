<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zauberbox Manager</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="pico.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="qrcode.min.js"></script>
</head>
<body>
    <header class="container">
        <nav>
            <ul id="nav-left">
                <li><strong class="rainbow">Zauberbox</strong></li>
            </ul>
            <ul id="nav-right">
                <!-- Dashboard actions here -->
            </ul>
        </nav>
    </header>

    <main class="container" id="app">
        <div aria-busy="true" id="loading">Initializing...</div>
    </main>

    <footer class="container">
        <hr>
        <small>Zauberbox &bull; <a href="#" onclick="loadDashboard(); return false;">Home</a> &bull; <a href="https://github.com/idavydov/zauberbox" target="_blank">GitHub</a></small>
    </footer>

    <dialog id="modal">
        <article>
            <header>
                <button aria-label="Close" rel="prev"></button>
                <p><strong id="modal-title">Confirm</strong></p>
            </header>
            <p id="modal-message">Are you sure?</p>
            <input type="text" id="modal-input" style="display:none;">
            <footer>
                <button id="modal-cancel" class="secondary">Cancel</button>
                <button id="modal-confirm">Confirm</button>
            </footer>
        </article>
    </dialog>

    <dialog id="tag-write-modal">
        <article>
            <header>
                <p><strong>Write NFC Tag</strong></p>
            </header>
            <p id="tag-write-album">Album</p>
            <p id="tag-write-message">Place a tag on the reader.</p>
            <p id="tag-write-status" class="debug-status"></p>
            <span id="tag-write-busy" aria-busy="true" style="display:none;">Waiting...</span>
            <footer>
                <button id="tag-write-cancel" class="secondary">Cancel</button>
                <button id="tag-write-done">Close</button>
            </footer>
        </article>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
